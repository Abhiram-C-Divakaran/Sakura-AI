name: Sakura AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: anime-ai/backend
    env:
      JWT_SECRET: "test-secret-key-for-ci-minimum-32-chars-ok"
      INTEGRATION_ENCRYPTION_KEY: "test_integration_key_32_chars_ok!"
      SAKURA_SANDBOX_SERVICE_TOKEN: "test_sandbox_service_token_ci"
      ENVIRONMENT: "development"
      DATABASE_URL: "sqlite:///./ci_test.db"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Alembic Migrations
        run: |
          python -m alembic upgrade head

      - name: Validate Docker Compose Configuration
        working-directory: anime-ai
        env:
          POSTGRES_PASSWORD: "ci_test_postgres_password"
          JWT_SECRET: "test-secret-key-for-ci-minimum-32-chars-ok"
          INTEGRATION_ENCRYPTION_KEY: "test_integration_key_32_chars_ok!"
          SAKURA_SANDBOX_SERVICE_TOKEN: "test_sandbox_service_token_ci"
        run: |
          docker compose -f docker-compose.prod.yml config

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: anime-ai/frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: anime-ai/frontend/package.json

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Check
        run: npm run typecheck

      - name: Production Build
        run: npm run build
