name: Sakura AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests & Schema Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: sakura_ci
          POSTGRES_PASSWORD: sakura_ci_password
          POSTGRES_DB: sakura_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: anime-ai/backend
    env:
      JWT_SECRET: "test-secret-key-for-ci-minimum-32-chars-ok"
      INTEGRATION_ENCRYPTION_KEY: "test_integration_key_32_chars_ok!"
      SAKURA_SANDBOX_SERVICE_TOKEN: "test_sandbox_service_token_ci"
      SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY: "test_capability_signing_key_32chars"
      REDIS_URL: "redis://localhost:6379/0"
      ENVIRONMENT: "test"
      SAKURA_EMBEDDED_WORKER: "false"
      SAKURA_EMBEDDED_SCHEDULER: "false"
      SAKURA_EMBEDDED_CODING_WORKER: "false"
      SAKURA_WORKSPACE_ROOT: "/tmp/sakura_workspaces"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: anime-ai/backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Static Compilation
        run: |
          python -m compileall -q .

      - name: Validate Alembic Migrations on PostgreSQL
        env:
          DATABASE_URL: "postgresql+psycopg2://sakura_ci:sakura_ci_password@localhost:5432/sakura_ci_db"
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: Run Schema Parity Test on PostgreSQL
        env:
          DATABASE_URL: "postgresql+psycopg2://sakura_ci:sakura_ci_password@localhost:5432/sakura_ci_db"
        run: |
          python -m unittest tests/test_schema_parity.py -v

      - name: Run PostgreSQL Scheduler Concurrency Test
        env:
          DATABASE_URL: "postgresql+psycopg2://sakura_ci:sakura_ci_password@localhost:5432/sakura_ci_db"
          SAKURA_POSTGRES_TEST: "1"
        run: |
          python -m unittest tests/test_scheduler_resilience.py -v

      - name: Run PostgreSQL pgvector, Outbox Concurrency & Variation Idempotency Tests (Zero Skips)
        env:
          DATABASE_URL: "postgresql+psycopg2://sakura_ci:sakura_ci_password@localhost:5432/sakura_ci_db"
          SAKURA_POSTGRES_TEST: "1"
        run: |
          python -c '
          import sys, unittest
          loader = unittest.TestLoader()
          suite = loader.loadTestsFromName("tests.test_postgres_pgvector_and_concurrency")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun == 0 or len(result.skipped) > 0 or not result.wasSuccessful():
              print(f"ERROR: PG suite failed or skipped (ran={result.testsRun}, skipped={len(result.skipped)})", file=sys.stderr)
              sys.exit(1)
          print(f"SUCCESS: Executed {result.testsRun} PostgreSQL pgvector/concurrency tests with 0 skips.")
          '

      - name: Verify PostgreSQL 15 Backup and Restore Scripts (Official postgres:15 Client)
        env:
          DATABASE_URL: "postgresql+psycopg2://sakura_ci:sakura_ci_password@localhost:5432/sakura_ci_db"
        run: |
          set -euo pipefail
          mkdir -p /tmp/sakura_pg_backups
          ALEMBIC_HEAD=$(python -m alembic current | awk '{print $1}')
          echo "Expected Alembic head: ${ALEMBIC_HEAD}"
          if [ -z "${ALEMBIC_HEAD}" ]; then
            echo "ERROR: Could not determine Alembic head!" >&2
            exit 1
          fi

          # Seed a deterministic probe user AND a real non-null 1536-dim vector chunk
          python -c "
          import uuid
          from database.db import get_db_context
          from database.models import User, Document, DocumentChunk, utc_now
          with get_db_context() as db:
              user = db.query(User).filter(User.username == 'ci_restore_probe').first()
              if not user:
                  user = User(id=uuid.uuid4(), username='ci_restore_probe', email='ci_restore_probe@example.com', hashed_password='probe_hash_not_for_login', created_at=utc_now())
                  db.add(user)
                  db.flush()
              doc = Document(id=uuid.uuid4(), user_id=user.id, filename='restore_vec_probe.md', mime_type='text/markdown', storage_path='/tmp/restore_vec_probe.md', is_knowledge_base=True, indexing_status='READY')
              db.add(doc)
              db.flush()
              vec = [0.0] * 1536
              vec[0] = 0.8
              vec[1] = 0.6
              db.add(DocumentChunk(id=uuid.uuid4(), document_id=doc.id, chunk_index=0, content='CI restore pgvector probe', embedding=vec))
              db.commit()
          "

          # Run backup & restore strictly inside official postgres:15 container (version-pinned to PG 15 server)
          docker run --rm --network host \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=sakura_ci \
            -e POSTGRES_DB=sakura_ci_db \
            -e PGPASSWORD=sakura_ci_password \
            -e BACKUP_DIR=/backups \
            -e EXPECTED_ALEMBIC_HEAD="${ALEMBIC_HEAD}" \
            -e REQUIRED_MIN_USERS=1 \
            -e EXPECTED_USER_USERNAME=ci_restore_probe \
            -e REQUIRE_CHECKSUM=true \
            -e REQUIRE_PGVECTOR=true \
            -e REQUIRE_RESTORED_VECTOR=true \
            -v /tmp/sakura_pg_backups:/backups \
            -v "${GITHUB_WORKSPACE}/anime-ai/ops/scripts:/scripts:ro" \
            postgres:15 \
            bash -c '
              set -euo pipefail
              bash /scripts/backup_postgres.sh
              LATEST_DUMP=$(ls -1t /backups/sakura_sakura_ci_db_*.dump | head -n1)
              bash /scripts/verify_restore.sh "$LATEST_DUMP"

              # Negative check 1: checksum-tampered dump MUST fail verification non-zero
              TAMPER_DUMP=/backups/tampered_probe.dump
              cp "$LATEST_DUMP" "$TAMPER_DUMP"
              cp "${LATEST_DUMP}.sha256" "${TAMPER_DUMP}.sha256"
              sed -i "s|$(basename "$LATEST_DUMP")|$(basename "$TAMPER_DUMP")|g" "${TAMPER_DUMP}.sha256"
              printf "CORRUPTED_BYTES" >> "$TAMPER_DUMP"
              if bash /scripts/verify_restore.sh "$TAMPER_DUMP"; then
                echo "ERROR: verify_restore.sh accepted a checksum-tampered dump!" >&2
                exit 1
              fi

              # Negative check 2: corrupted archive WITH matching checksum MUST ALSO fail non-zero
              CORRUPT_DUMP=/backups/corrupt_probe.dump
              printf "NOT_A_VALID_PG_DUMP_ARCHIVE" > "$CORRUPT_DUMP"
              sha256sum "$CORRUPT_DUMP" > "${CORRUPT_DUMP}.sha256"
              if bash /scripts/verify_restore.sh "$CORRUPT_DUMP"; then
                echo "ERROR: verify_restore.sh accepted a corrupted archive!" >&2
                exit 1
              fi
              echo "[verify] Confirmed both tampered-checksum and corrupted-archive dumps fail non-zero."
            '

      - name: Run Storage Persistence Integration Test
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
        run: |
          python -m unittest tests/test_storage_persistence_integration.py -v

      - name: Run Frontend API Routing Smoke Test
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
        run: |
          python -m unittest tests/test_frontend_api_routing.py -v

      - name: Validate Docker Compose Production Configuration
        working-directory: anime-ai
        env:
          POSTGRES_PASSWORD: "ci_test_postgres_password"
          JWT_SECRET: "test-secret-key-for-ci-minimum-32-chars-ok"
          INTEGRATION_ENCRYPTION_KEY: "test_integration_key_32_chars_ok!"
          SAKURA_SANDBOX_SERVICE_TOKEN: "test_sandbox_service_token_ci"
          SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY: "test_capability_signing_key_32chars"
        run: |
          docker compose -f docker-compose.prod.yml config

      - name: Build Production Backend Docker Image
        working-directory: anime-ai/backend
        run: |
          docker build -t sakura-backend:test -f Dockerfile .

      - name: Run Full Backend Test Suite
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          PYTHONUNBUFFERED: "1"
          SAKURA_SANDBOX_RUNTIME: "local_restricted"
          ENVIRONMENT: "test"
          SAKURA_EMBEDDED_WORKER: "false"
          SAKURA_EMBEDDED_SCHEDULER: "false"
          SAKURA_EMBEDDED_CODING_WORKER: "false"
          SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY: "test_capability_signing_key_32chars"
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: anime-ai/frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: anime-ai/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Production Build
        run: npm run build

      - name: Install Playwright Chromium & Run Landing Page Browser Smoke Tests
        run: |
          npx playwright install --with-deps chromium
          npx next start -H 127.0.0.1 -p 3000 &
          NEXT_PID=$!
          trap "kill $NEXT_PID || true" EXIT
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:3000/ >/dev/null; do sleep 1; done'
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npm run test:e2e

      - name: Build and Validate Production Frontend Docker Image
        run: |
          docker build -t sakura-frontend:test -f Dockerfile .

  sandbox-integration:
    name: Docker Sandbox E2E Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Build Sandbox Execution Container
        run: |
          docker build -t sakura-sandbox:latest -f anime-ai/sandbox/Dockerfile anime-ai/sandbox

      - name: Build Sandbox Executor Service
        run: |
          docker build -t sakura-sandbox-executor:latest -f anime-ai/backend/Dockerfile.sandbox-executor anime-ai/backend

      - name: Build Backend Test Runner Image
        run: |
          docker build -t sakura-backend:ci-test -f anime-ai/backend/Dockerfile anime-ai/backend

      - name: Start Redis and Sandbox Executor with Shared Workspace Volume
        env:
          POSTGRES_PASSWORD: "ci_secret_super_secret_pg_pwd"
          JWT_SECRET: "ci_secret_super_secret_jwt_key_32c"
          HOST_SENSITIVE_SECRET: "very_sensitive_host_secret_should_never_leak"
          SAKURA_SANDBOX_SERVICE_TOKEN: "ci_test_sandbox_token_abc123"
          SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY: "ci_test_capability_signing_key_32chars"
        run: |
          docker network create sakura_ci_net
          docker run -d --name sakura-ci-redis --network sakura_ci_net -p 6379:6379 redis:7-alpine
          docker volume create sakura_workspaces_vol
          docker run -d --name sakura-sandbox-executor \
            --network sakura_ci_net \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v sakura_workspaces_vol:/workspaces \
            -e REDIS_URL=redis://sakura-ci-redis:6379/0 \
            -e SAKURA_SANDBOX_SERVICE_TOKEN=ci_test_sandbox_token_abc123 \
            -e SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY=ci_test_capability_signing_key_32chars \
            -e SAKURA_SANDBOX_IMAGE=sakura-sandbox:latest \
            -e SAKURA_WORKSPACES_VOLUME=sakura_workspaces_vol \
            -e SAKURA_WORKSPACE_ROOT=/workspaces \
            -e POSTGRES_PASSWORD="ci_secret_super_secret_pg_pwd" \
            -e JWT_SECRET="ci_secret_super_secret_jwt_key_32c" \
            -e HOST_SENSITIVE_SECRET="very_sensitive_host_secret_should_never_leak" \
            -e ENVIRONMENT="production" \
            -p 9000:9000 \
            sakura-sandbox-executor:latest

      - name: Wait for Executor /readiness (Fail if Not Ready)
        run: |
          set -e
          READY=0
          for i in $(seq 1 30); do
            BODY=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" http://localhost:9000/readiness || true)
            STATUS=$(echo "$BODY" | tail -n1 | sed 's/HTTP_STATUS://')
            JSON=$(echo "$BODY" | sed '$d')
            echo "[attempt $i/30] HTTP $STATUS -> $JSON"
            if [ "$STATUS" = "200" ] && echo "$JSON" | grep -q '"ready":true'; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "ERROR: Sandbox executor did not become ready within 60s."
            exit 1
          fi

      - name: Run Real Docker Sandbox E2E, Topology & Production Coding Tests Inside Container (Zero Skips Allowed)
        run: |
          docker run --rm \
            --network sakura_ci_net \
            -v sakura_workspaces_vol:/workspaces \
            -e SAKURA_SANDBOX_E2E=1 \
            -e SAKURA_SANDBOX_URL=http://sakura-sandbox-executor:9000 \
            -e SAKURA_SANDBOX_EXECUTOR_URL=http://sakura-sandbox-executor:9000 \
            -e SAKURA_SANDBOX_SERVICE_TOKEN=ci_test_sandbox_token_abc123 \
            -e SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY=ci_test_capability_signing_key_32chars \
            -e SAKURA_WORKSPACE_ROOT=/workspaces \
            -e SAKURA_SHARED_WORKSPACE_ROOT=/workspaces \
            -e DATABASE_URL=sqlite:////tmp/sakura_remote_coding_e2e.db \
            -e REDIS_URL=redis://sakura-ci-redis:6379/0 \
            -e POSTGRES_PASSWORD=ci_secret_super_secret_pg_pwd \
            -e JWT_SECRET=ci_secret_super_secret_jwt_key_32c \
            -e INTEGRATION_ENCRYPTION_KEY=ci_secret_integration_key_32_chr! \
            -e HOST_SENSITIVE_SECRET=very_sensitive_host_secret_should_never_leak \
            sakura-backend:ci-test \
            python -c '
          import sys, unittest
          loader = unittest.TestLoader()
          suite = unittest.TestSuite()
          suite.addTests(loader.loadTestsFromName("tests.test_sandbox_e2e_docker"))
          suite.addTests(loader.loadTestsFromName("tests.test_workspace_topology_e2e"))
          suite.addTests(loader.loadTestsFromName("tests.test_production_remote_coding_e2e"))
          runner = unittest.TextTestRunner(verbosity=2)
          result = runner.run(suite)
          if result.testsRun == 0:
              print("ERROR: Zero E2E tests executed!", file=sys.stderr)
              sys.exit(1)
          if len(result.skipped) > 0:
              print(f"ERROR: E2E tests silently skipped: {result.skipped}", file=sys.stderr)
              sys.exit(1)
          if not result.wasSuccessful():
              sys.exit(1)
          print(f"SUCCESS: Executed {result.testsRun} Docker E2E tests with 0 skips.")
          '

      - name: Verify Zero Orphaned Sandbox Child Containers
        if: always()
        run: |
          ORPHANS=$(docker ps -a --filter "name=sakura-exec-" --filter "name=sakura-smoke-" --format "{{.ID}} {{.Names}} {{.Status}}")
          if [ -n "$ORPHANS" ]; then
            echo "ERROR: Lingering sandbox child containers detected:"
            echo "$ORPHANS"
            exit 1
          fi
          echo "Verified 0 lingering sandbox child containers."

      - name: Collect Sandbox Executor Diagnostics on Failure
        if: failure()
        run: |
          echo "=== docker ps -a ==="
          docker ps -a || true
          echo "=== docker logs sakura-sandbox-executor ==="
          docker logs sakura-sandbox-executor || true
          echo "=== docker version & info inside sakura-sandbox-executor ==="
          docker exec sakura-sandbox-executor which docker || true
          docker exec sakura-sandbox-executor docker version || true
          docker exec sakura-sandbox-executor docker info || true
          echo "=== docker image inspect sakura-sandbox:latest ==="
          docker image inspect sakura-sandbox:latest --format '{{.Id}} {{.RepoTags}} User={{.Config.User}}' || true
          echo "=== docker volume inspect sakura_workspaces_vol ==="
          docker volume inspect sakura_workspaces_vol || true
          echo "=== executor process health (/health) ==="
          curl -i -sS http://localhost:9000/health || true
          echo ""
          echo "=== executor full /readiness response ==="
          curl -i -sS http://localhost:9000/readiness || true
          echo ""

  fullstack-integration:
    name: Full-Stack Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: sakura_fs
          POSTGRES_PASSWORD: sakura_fs_password
          POSTGRES_DB: sakura_fs_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql+psycopg2://sakura_fs:sakura_fs_password@localhost:5432/sakura_fs_db"
      REDIS_URL: "redis://localhost:6379/0"
      JWT_SECRET: "test-secret-key-for-fullstack-ci-min-32-chars"
      INTEGRATION_ENCRYPTION_KEY: "test_integration_key_32_chars_fs!"
      SAKURA_SANDBOX_SERVICE_TOKEN: "test_sandbox_service_token_fs_ci"
      SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY: "test_capability_signing_key_32fs!"
      ENVIRONMENT: "test"
      SAKURA_DETERMINISTIC_TEST_PROVIDERS: "1"
      SAKURA_SANDBOX_RUNTIME: "local_restricted"
      SAKURA_WORKSPACE_ROOT: "/tmp/sakura_fullstack_workspaces"
      SAKURA_STORAGE_BACKEND: "local"
      SAKURA_STORAGE_ROOT: "/tmp/sakura_fullstack_storage"
      SAKURA_EMBEDDED_WORKER: "false"
      SAKURA_EMBEDDED_SCHEDULER: "false"
      SAKURA_EMBEDDED_CODING_WORKER: "false"
      SAKURA_WORKER_HANDLE_IMAGES: "false"
      SAKURA_QUOTA_IMAGE_DAILY: "3"
      SAKURA_API_PROXY_TARGET: "http://127.0.0.1:8000"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: anime-ai/backend/requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: anime-ai/frontend/package-lock.json

      - name: Install Backend & Frontend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r anime-ai/backend/requirements.txt
          cd anime-ai/frontend && npm ci && npx playwright install --with-deps chromium

      - name: Migrate PostgreSQL & Build Production Frontend
        run: |
          mkdir -p /tmp/sakura_fullstack_workspaces /tmp/sakura_fullstack_storage
          cd anime-ai/backend && python -m alembic upgrade head
          cd ../frontend && npm run build

      - name: Start Real Backend, Durable Workers & Frontend and Run Full-Stack Browser E2E
        run: |
          set -euo pipefail
          cd anime-ai/backend
          uvicorn main:app --host 127.0.0.1 --port 8000 >/tmp/sakura_api.log 2>&1 &
          API_PID=$!
          python -m tasks.worker >/tmp/sakura_worker.log 2>&1 &
          WORKER_PID=$!
          python -m media.image_worker >/tmp/sakura_img_worker.log 2>&1 &
          IMG_WORKER_PID=$!
          python -m coding.job_worker >/tmp/sakura_code_worker.log 2>&1 &
          CODE_WORKER_PID=$!

          cd ../frontend
          npx next start -H 127.0.0.1 -p 3000 >/tmp/sakura_frontend.log 2>&1 &
          FRONT_PID=$!

          cleanup() {
            kill $FRONT_PID $CODE_WORKER_PID $IMG_WORKER_PID $WORKER_PID $API_PID 2>/dev/null || true
          }
          trap cleanup EXIT

          timeout 45 bash -c 'until curl -sf http://127.0.0.1:8000/health >/dev/null; do sleep 1; done'
          timeout 45 bash -c 'until curl -sf http://127.0.0.1:3000/login >/dev/null; do sleep 1; done'

          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npm run test:e2e:fullstack

      - name: Print Service Logs on Failure
        if: failure()
        run: |
          for log in /tmp/sakura_api.log /tmp/sakura_worker.log /tmp/sakura_img_worker.log /tmp/sakura_code_worker.log /tmp/sakura_frontend.log; do
            echo "=== $log ==="
            tail -n 120 "$log" || true
          done
