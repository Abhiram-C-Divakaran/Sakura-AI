name: Sakura AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests & Schema Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: sakura_ci
          POSTGRES_PASSWORD: sakura_ci_password
          POSTGRES_DB: sakura_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: anime-ai/backend
    env:
      JWT_SECRET: "test-secret-key-for-ci-minimum-32-chars-ok"
      INTEGRATION_ENCRYPTION_KEY: "test_integration_key_32_chars_ok!"
      SAKURA_SANDBOX_SERVICE_TOKEN: "test_sandbox_service_token_ci"
      ENVIRONMENT: "test"
      SAKURA_EMBEDDED_WORKER: "false"
      SAKURA_EMBEDDED_SCHEDULER: "false"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: anime-ai/backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Static Compilation
        run: |
          python -m compileall -q .

      - name: Validate Alembic Migrations on PostgreSQL
        env:
          DATABASE_URL: "postgresql://sakura_ci:sakura_ci_password@localhost:5432/sakura_ci_db"
        run: |
          python -m alembic upgrade head

      - name: Run Schema Parity Test on PostgreSQL
        env:
          DATABASE_URL: "postgresql://sakura_ci:sakura_ci_password@localhost:5432/sakura_ci_db"
        run: |
          python -m unittest tests/test_schema_parity.py -v

      - name: Validate Docker Compose Configuration
        working-directory: anime-ai
        env:
          POSTGRES_PASSWORD: "ci_test_postgres_password"
          JWT_SECRET: "test-secret-key-for-ci-minimum-32-chars-ok"
          INTEGRATION_ENCRYPTION_KEY: "test_integration_key_32_chars_ok!"
          SAKURA_SANDBOX_SERVICE_TOKEN: "test_sandbox_service_token_ci"
        run: |
          docker compose -f docker-compose.prod.yml config

      - name: Run Backend Test Suite
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          PYTHONUNBUFFERED: "1"
          SAKURA_SANDBOX_RUNTIME: "local_restricted"
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: anime-ai/frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: anime-ai/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck

      - name: Production Build
        run: npm run build
