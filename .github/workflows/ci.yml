name: Sakura AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests & Schema Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: sakura_ci
          POSTGRES_PASSWORD: sakura_ci_password
          POSTGRES_DB: sakura_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: anime-ai/backend
    env:
      JWT_SECRET: "test-secret-key-for-ci-minimum-32-chars-ok"
      INTEGRATION_ENCRYPTION_KEY: "test_integration_key_32_chars_ok!"
      SAKURA_SANDBOX_SERVICE_TOKEN: "test_sandbox_service_token_ci"
      ENVIRONMENT: "test"
      SAKURA_EMBEDDED_WORKER: "false"
      SAKURA_EMBEDDED_SCHEDULER: "false"
      SAKURA_WORKSPACE_ROOT: "/tmp/sakura_workspaces"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: anime-ai/backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Static Compilation
        run: |
          python -m compileall -q .

      - name: Validate Alembic Migrations on PostgreSQL
        env:
          DATABASE_URL: "postgresql://sakura_ci:sakura_ci_password@localhost:5432/sakura_ci_db"
        run: |
          python -m alembic upgrade head

      - name: Run Schema Parity Test on PostgreSQL
        env:
          DATABASE_URL: "postgresql://sakura_ci:sakura_ci_password@localhost:5432/sakura_ci_db"
        run: |
          python -m unittest tests/test_schema_parity.py -v

      - name: Run PostgreSQL Scheduler Concurrency Test
        env:
          DATABASE_URL: "postgresql://sakura_ci:sakura_ci_password@localhost:5432/sakura_ci_db"
          SAKURA_POSTGRES_TEST: "1"
        run: |
          python -m unittest tests/test_scheduler_resilience.py -v

      - name: Run Storage Persistence Integration Test
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
        run: |
          python -m unittest tests/test_storage_persistence_integration.py -v

      - name: Run Frontend API Routing Smoke Test
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
        run: |
          python -m unittest tests/test_frontend_api_routing.py -v

      - name: Validate Docker Compose Configuration
        working-directory: anime-ai
        env:
          POSTGRES_PASSWORD: "ci_test_postgres_password"
          JWT_SECRET: "test-secret-key-for-ci-minimum-32-chars-ok"
          INTEGRATION_ENCRYPTION_KEY: "test_integration_key_32_chars_ok!"
          SAKURA_SANDBOX_SERVICE_TOKEN: "test_sandbox_service_token_ci"
        run: |
          docker compose -f docker-compose.prod.yml config

      - name: Run Backend Test Suite
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          PYTHONUNBUFFERED: "1"
          SAKURA_SANDBOX_RUNTIME: "local_restricted"
          ENVIRONMENT: "test"
          SAKURA_EMBEDDED_WORKER: "false"
          SAKURA_EMBEDDED_SCHEDULER: "false"
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: anime-ai/frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: anime-ai/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Production Build
        run: npm run build

  sandbox-integration:
    name: Docker Sandbox E2E Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Sandbox Execution Container
        run: |
          docker build -t sakura-sandbox:latest -f anime-ai/sandbox/Dockerfile anime-ai/sandbox

      - name: Build Sandbox Executor Service
        run: |
          docker build -t sakura-sandbox-executor:latest -f anime-ai/backend/Dockerfile.sandbox-executor anime-ai/backend

      - name: Create Workspaces Volume and Start Executor
        env:
          POSTGRES_PASSWORD: "ci_secret_super_secret_pg_pwd"
          JWT_SECRET: "ci_secret_super_secret_jwt_key_32c"
          HOST_SENSITIVE_SECRET: "very_sensitive_host_secret_should_never_leak"
          SAKURA_SANDBOX_SERVICE_TOKEN: "ci_test_sandbox_token_abc123"
        run: |
          docker volume create sakura_workspaces_vol
          docker run -d --name sakura-sandbox-executor \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v sakura_workspaces_vol:/workspaces \
            -e SAKURA_SANDBOX_SERVICE_TOKEN=ci_test_sandbox_token_abc123 \
            -e SAKURA_SANDBOX_IMAGE=sakura-sandbox:latest \
            -e SAKURA_WORKSPACES_VOLUME=sakura_workspaces_vol \
            -e SAKURA_WORKSPACE_ROOT=/workspaces \
            -e POSTGRES_PASSWORD="ci_secret_super_secret_pg_pwd" \
            -e JWT_SECRET="ci_secret_super_secret_jwt_key_32c" \
            -e HOST_SENSITIVE_SECRET="very_sensitive_host_secret_should_never_leak" \
            -e ENVIRONMENT="production" \
            -p 9000:9000 \
            sakura-sandbox-executor:latest

      - name: Wait for Executor Service Readiness
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:9000/health; do echo "Waiting for sandbox executor..."; sleep 2; done'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: anime-ai/backend/requirements.txt

      - name: Install Test Dependencies
        working-directory: anime-ai/backend
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Sandbox E2E Docker Integration Test
        working-directory: anime-ai/backend
        env:
          SAKURA_SANDBOX_E2E: "1"
          SAKURA_SANDBOX_URL: "http://localhost:9000"
          SAKURA_SANDBOX_SERVICE_TOKEN: "ci_test_sandbox_token_abc123"
          POSTGRES_PASSWORD: "ci_secret_super_secret_pg_pwd"
          JWT_SECRET: "ci_secret_super_secret_jwt_key_32c"
          HOST_SENSITIVE_SECRET: "very_sensitive_host_secret_should_never_leak"
        run: |
          python -m unittest tests/test_sandbox_e2e_docker.py -v

