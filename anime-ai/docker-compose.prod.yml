version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: sakura_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Production requires POSTGRES_PASSWORD environment variable}
      POSTGRES_DB: ${POSTGRES_DB:-anime_ai}
    # No public host port in production; accessible only via internal network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-anime_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sakura_redis
    restart: always
    # No public host port in production; accessible only via internal network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakura_migration
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anime_ai}
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy

  sandbox-executor:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakura_sandbox_executor
    restart: always
    user: "0:0"
    command: ["uvicorn", "coding.sandbox_service:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      - SAKURA_SANDBOX_SERVICE_TOKEN=${SAKURA_SANDBOX_SERVICE_TOKEN:?Production requires SAKURA_SANDBOX_SERVICE_TOKEN}
      - SAKURA_SANDBOX_IMAGE=${SAKURA_SANDBOX_IMAGE:-sakura-sandbox:latest}
      - ENVIRONMENT=production
      - PORT=9000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Internal port 9000 only; not exposed to host
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; r = httpx.get('http://localhost:9000/health'); exit(0 if r.status_code == 200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakura_backend_api
    restart: always
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anime_ai}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?Production requires JWT_SECRET}
      - INTEGRATION_ENCRYPTION_KEY=${INTEGRATION_ENCRYPTION_KEY:?Production requires INTEGRATION_ENCRYPTION_KEY}
      - SAKURA_SANDBOX_EXECUTOR_URL=http://sandbox-executor:9000
      - SAKURA_SANDBOX_SERVICE_TOKEN=${SAKURA_SANDBOX_SERVICE_TOKEN}
      - ENVIRONMENT=production
      - SAKURA_EMBEDDED_SCHEDULER=false
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      sandbox-executor:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakura_worker
    restart: always
    command: ["python", "-m", "tasks.worker"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anime_ai}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - INTEGRATION_ENCRYPTION_KEY=${INTEGRATION_ENCRYPTION_KEY}
      - ENVIRONMENT=production
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakura_scheduler
    restart: always
    command: ["python", "-m", "tasks.scheduler"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anime_ai}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sakura_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend-api

volumes:
  postgres_data:
  redis_data:
