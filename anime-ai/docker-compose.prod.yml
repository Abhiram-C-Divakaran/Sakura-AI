version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: sakura_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Production requires POSTGRES_PASSWORD environment variable}
      POSTGRES_DB: ${POSTGRES_DB:-anime_ai}
    # No public host port in production; accessible only via internal network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-anime_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sakura_redis
    restart: always
    # No public host port in production; accessible only via internal network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakura_migration
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anime_ai}
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy

  sandbox-runtime:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: sakura-sandbox:${SAKURA_SANDBOX_IMAGE_TAG:-1.0.0}
    container_name: sakura_sandbox_runtime_build
    restart: "no"
    entrypoint: ["echo", "Sakura Sandbox runtime image built successfully."]

  sandbox-executor:
    build:
      context: ./backend
      dockerfile: Dockerfile.sandbox-executor
    container_name: sakura_sandbox_executor
    restart: always
    user: "0:0"
    command: ["uvicorn", "coding.sandbox_service:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      - SAKURA_SANDBOX_SERVICE_TOKEN=${SAKURA_SANDBOX_SERVICE_TOKEN:?Production requires SAKURA_SANDBOX_SERVICE_TOKEN}
      - SAKURA_SANDBOX_IMAGE=${SAKURA_SANDBOX_IMAGE:-sakura-sandbox:${SAKURA_SANDBOX_IMAGE_TAG:-1.0.0}}
      - SAKURA_WORKSPACE_ROOT=/workspaces
      - SAKURA_WORKSPACES_VOLUME=${SAKURA_WORKSPACES_VOLUME_NAME:-sakura_workspaces}
      - ENVIRONMENT=production
      - PORT=9000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sakura_workspaces:/workspaces
    # Internal port 9000 only; not exposed to host
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; r = httpx.get('http://localhost:9000/readiness'); exit(0 if r.status_code == 200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      sandbox-runtime:
        condition: service_completed_successfully

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakura_backend_api
    restart: always
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anime_ai}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?Production requires JWT_SECRET}
      - INTEGRATION_ENCRYPTION_KEY=${INTEGRATION_ENCRYPTION_KEY:?Production requires INTEGRATION_ENCRYPTION_KEY}
      - SAKURA_SANDBOX_EXECUTOR_URL=http://sandbox-executor:9000
      - SAKURA_SANDBOX_SERVICE_TOKEN=${SAKURA_SANDBOX_SERVICE_TOKEN}
      - SAKURA_WORKSPACE_ROOT=/workspaces
      - ENVIRONMENT=production
      - SAKURA_EMBEDDED_SCHEDULER=false
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SAKURA_STORAGE_BACKEND=${SAKURA_STORAGE_BACKEND:-s3}
      - SAKURA_STORAGE_ROOT=${SAKURA_STORAGE_ROOT:-/data/library}
      - SAKURA_STORAGE_BUCKET=${SAKURA_STORAGE_BUCKET:-sakura-library}
      - SAKURA_STORAGE_ENDPOINT=${SAKURA_STORAGE_ENDPOINT:-}
      - SAKURA_STORAGE_REGION=${SAKURA_STORAGE_REGION:-us-east-1}
      - SAKURA_STORAGE_ACCESS_KEY=${SAKURA_STORAGE_ACCESS_KEY:-}
      - SAKURA_STORAGE_SECRET_KEY=${SAKURA_STORAGE_SECRET_KEY:-}
    volumes:
      - sakura_workspaces:/workspaces
      - sakura_library_data:/data/library
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; r = httpx.get('http://localhost:8000/readiness'); exit(0 if r.status_code == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakura_worker
    restart: always
    command: ["python", "-m", "tasks.worker"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anime_ai}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - INTEGRATION_ENCRYPTION_KEY=${INTEGRATION_ENCRYPTION_KEY}
      - SAKURA_WORKSPACE_ROOT=/workspaces
      - ENVIRONMENT=production
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SAKURA_STORAGE_BACKEND=${SAKURA_STORAGE_BACKEND:-s3}
      - SAKURA_STORAGE_ROOT=${SAKURA_STORAGE_ROOT:-/data/library}
      - SAKURA_STORAGE_BUCKET=${SAKURA_STORAGE_BUCKET:-sakura-library}
      - SAKURA_STORAGE_ENDPOINT=${SAKURA_STORAGE_ENDPOINT:-}
      - SAKURA_STORAGE_REGION=${SAKURA_STORAGE_REGION:-us-east-1}
      - SAKURA_STORAGE_ACCESS_KEY=${SAKURA_STORAGE_ACCESS_KEY:-}
      - SAKURA_STORAGE_SECRET_KEY=${SAKURA_STORAGE_SECRET_KEY:-}
    volumes:
      - sakura_workspaces:/workspaces
      - sakura_library_data:/data/library
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakura_scheduler
    restart: always
    command: ["python", "-m", "tasks.scheduler"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anime_ai}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sakura_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend-api

volumes:
  postgres_data:
  redis_data:
  sakura_workspaces:
    name: ${SAKURA_WORKSPACES_VOLUME_NAME:-sakura_workspaces}
  sakura_library_data:
    name: ${SAKURA_LIBRARY_VOLUME_NAME:-sakura_library_data}
