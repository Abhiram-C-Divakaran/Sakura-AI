services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: sakura_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Production requires POSTGRES_PASSWORD environment variable}
      POSTGRES_DB: ${POSTGRES_DB:-anime_ai}
    # No public host port in production; accessible only via internal network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-anime_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sakura_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    # No public host port in production; accessible only via internal network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakura_migration
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anime_ai}
      - JWT_SECRET=${JWT_SECRET:?Production requires JWT_SECRET}
      - INTEGRATION_ENCRYPTION_KEY=${INTEGRATION_ENCRYPTION_KEY:?Production requires INTEGRATION_ENCRYPTION_KEY}
      - SAKURA_SANDBOX_SERVICE_TOKEN=${SAKURA_SANDBOX_SERVICE_TOKEN:?Production requires SAKURA_SANDBOX_SERVICE_TOKEN}
      - SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY=${SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY:?Production requires SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY}
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy

  sandbox-runtime:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: sakura-sandbox:${SAKURA_SANDBOX_IMAGE_TAG:-1.0.0}
    container_name: sakura_sandbox_runtime_build
    restart: "no"
    entrypoint: ["echo", "Sakura Sandbox runtime image built successfully."]

  sandbox-executor:
    build:
      context: ./backend
      dockerfile: Dockerfile.sandbox-executor
    container_name: sakura_sandbox_executor
    restart: always
    # Uses host docker group GID (or root fallback only if DOCKER_GID unset) without --privileged
    user: "0:${DOCKER_GID:-0}"
    command: ["uvicorn", "coding.sandbox_service:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SAKURA_SANDBOX_SERVICE_TOKEN=${SAKURA_SANDBOX_SERVICE_TOKEN:?Production requires SAKURA_SANDBOX_SERVICE_TOKEN}
      - SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY=${SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY:?Production requires SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY}
      - SAKURA_SANDBOX_IMAGE=${SAKURA_SANDBOX_IMAGE:-sakura-sandbox:${SAKURA_SANDBOX_IMAGE_TAG:-1.0.0}}
      - SAKURA_WORKSPACE_ROOT=/workspaces
      - SAKURA_WORKSPACES_VOLUME=${SAKURA_WORKSPACES_VOLUME_NAME:-sakura_workspaces}
      - ENVIRONMENT=production
      - PORT=9000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sakura_workspaces:/workspaces
    # Internal port 9000 only; not exposed to host
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; r = httpx.get('http://localhost:9000/readiness'); exit(0 if r.status_code == 200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
      sandbox-runtime:
        condition: service_completed_successfully

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakura_backend_api
    restart: always
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anime_ai}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?Production requires JWT_SECRET}
      - INTEGRATION_ENCRYPTION_KEY=${INTEGRATION_ENCRYPTION_KEY:?Production requires INTEGRATION_ENCRYPTION_KEY}
      - SAKURA_SANDBOX_EXECUTOR_URL=http://sandbox-executor:9000
      - SAKURA_SANDBOX_SERVICE_TOKEN=${SAKURA_SANDBOX_SERVICE_TOKEN:?Production requires SAKURA_SANDBOX_SERVICE_TOKEN}
      - SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY=${SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY:?Production requires SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY}
      - SAKURA_WORKSPACE_ROOT=/workspaces
      - ENVIRONMENT=production
      - SAKURA_EMBEDDED_WORKER=false
      - SAKURA_EMBEDDED_SCHEDULER=false
      - SAKURA_EMBEDDED_CODING_WORKER=false
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-}
      # Explicit trusted reverse proxy CIDR only (never default to broad private ranges)
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-127.0.0.1/32}
      - SAKURA_QUOTA_CHAT_DAILY=${SAKURA_QUOTA_CHAT_DAILY:-500}
      - SAKURA_QUOTA_IMAGE_DAILY=${SAKURA_QUOTA_IMAGE_DAILY:-50}
      - SAKURA_QUOTA_CODING_DAILY=${SAKURA_QUOTA_CODING_DAILY:-50}
      - SAKURA_QUOTA_UPLOAD_DAILY=${SAKURA_QUOTA_UPLOAD_DAILY:-100}
      - SAKURA_QUOTA_SCHEDULED_DAILY=${SAKURA_QUOTA_SCHEDULED_DAILY:-30}
      - SAKURA_STORAGE_BACKEND=${SAKURA_STORAGE_BACKEND:-s3}
      - SAKURA_STORAGE_ROOT=${SAKURA_STORAGE_ROOT:-/data/library}
      - SAKURA_STORAGE_BUCKET=${SAKURA_STORAGE_BUCKET:-sakura-library}
      - SAKURA_STORAGE_ENDPOINT=${SAKURA_STORAGE_ENDPOINT:-}
      - SAKURA_STORAGE_REGION=${SAKURA_STORAGE_REGION:-us-east-1}
      - SAKURA_STORAGE_ACCESS_KEY=${SAKURA_STORAGE_ACCESS_KEY:-}
      - SAKURA_STORAGE_SECRET_KEY=${SAKURA_STORAGE_SECRET_KEY:-}
    volumes:
      - sakura_workspaces:/workspaces
      - sakura_library_data:/data/library
    # Bind strictly to loopback so public traffic must pass through the TLS reverse proxy
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; r = httpx.get('http://localhost:8000/readiness'); exit(0 if r.status_code == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      sandbox-executor:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakura_worker
    restart: always
    command: ["python", "-m", "tasks.worker"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anime_ai}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?Production requires JWT_SECRET}
      - INTEGRATION_ENCRYPTION_KEY=${INTEGRATION_ENCRYPTION_KEY:?Production requires INTEGRATION_ENCRYPTION_KEY}
      - SAKURA_SANDBOX_SERVICE_TOKEN=${SAKURA_SANDBOX_SERVICE_TOKEN:?Production requires SAKURA_SANDBOX_SERVICE_TOKEN}
      - SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY=${SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY:?Production requires SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY}
      - SAKURA_WORKSPACE_ROOT=/workspaces
      - ENVIRONMENT=production
      - SAKURA_WORKER_HANDLE_IMAGES=false
      - TASK_WORKER_CONCURRENCY=${TASK_WORKER_CONCURRENCY:-2}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SAKURA_STORAGE_BACKEND=${SAKURA_STORAGE_BACKEND:-s3}
      - SAKURA_STORAGE_ROOT=${SAKURA_STORAGE_ROOT:-/data/library}
      - SAKURA_STORAGE_BUCKET=${SAKURA_STORAGE_BUCKET:-sakura-library}
      - SAKURA_STORAGE_ENDPOINT=${SAKURA_STORAGE_ENDPOINT:-}
      - SAKURA_STORAGE_REGION=${SAKURA_STORAGE_REGION:-us-east-1}
      - SAKURA_STORAGE_ACCESS_KEY=${SAKURA_STORAGE_ACCESS_KEY:-}
      - SAKURA_STORAGE_SECRET_KEY=${SAKURA_STORAGE_SECRET_KEY:-}
    volumes:
      - sakura_workspaces:/workspaces
      - sakura_library_data:/data/library
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from database.db import engine; from sqlalchemy import text; conn = engine.connect(); conn.execute(text('SELECT 1')); conn.close()\""]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  image-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakura_image_worker
    restart: always
    command: ["python", "-m", "media.image_worker"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anime_ai}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?Production requires JWT_SECRET}
      - INTEGRATION_ENCRYPTION_KEY=${INTEGRATION_ENCRYPTION_KEY:?Production requires INTEGRATION_ENCRYPTION_KEY}
      - SAKURA_SANDBOX_SERVICE_TOKEN=${SAKURA_SANDBOX_SERVICE_TOKEN:?Production requires SAKURA_SANDBOX_SERVICE_TOKEN}
      - SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY=${SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY:?Production requires SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY}
      - IMAGE_WORKER_CONCURRENCY=${IMAGE_WORKER_CONCURRENCY:-2}
      - ENVIRONMENT=production
      - SAKURA_STORAGE_BACKEND=${SAKURA_STORAGE_BACKEND:-s3}
      - SAKURA_STORAGE_ROOT=${SAKURA_STORAGE_ROOT:-/data/library}
      - SAKURA_STORAGE_BUCKET=${SAKURA_STORAGE_BUCKET:-sakura-library}
      - SAKURA_STORAGE_ENDPOINT=${SAKURA_STORAGE_ENDPOINT:-}
      - SAKURA_STORAGE_REGION=${SAKURA_STORAGE_REGION:-us-east-1}
      - SAKURA_STORAGE_ACCESS_KEY=${SAKURA_STORAGE_ACCESS_KEY:-}
      - SAKURA_STORAGE_SECRET_KEY=${SAKURA_STORAGE_SECRET_KEY:-}
    volumes:
      - sakura_library_data:/data/library
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from database.db import engine; from sqlalchemy import text; conn = engine.connect(); conn.execute(text('SELECT 1')); conn.close()\""]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  coding-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakura_coding_worker
    restart: always
    command: ["python", "-m", "coding.job_worker"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anime_ai}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?Production requires JWT_SECRET}
      - INTEGRATION_ENCRYPTION_KEY=${INTEGRATION_ENCRYPTION_KEY:?Production requires INTEGRATION_ENCRYPTION_KEY}
      - SAKURA_WORKSPACE_ROOT=/workspaces
      - SAKURA_SANDBOX_EXECUTOR_URL=http://sandbox-executor:9000
      - SAKURA_SANDBOX_SERVICE_TOKEN=${SAKURA_SANDBOX_SERVICE_TOKEN:?Production requires SAKURA_SANDBOX_SERVICE_TOKEN}
      - SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY=${SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY:?Production requires SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY}
      - ENVIRONMENT=production
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    volumes:
      - sakura_workspaces:/workspaces
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from database.db import engine; from sqlalchemy import text; conn = engine.connect(); conn.execute(text('SELECT 1')); conn.close()\""]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      sandbox-executor:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakura_scheduler
    restart: always
    command: ["python", "-m", "tasks.scheduler"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anime_ai}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?Production requires JWT_SECRET}
      - INTEGRATION_ENCRYPTION_KEY=${INTEGRATION_ENCRYPTION_KEY:?Production requires INTEGRATION_ENCRYPTION_KEY}
      - SAKURA_SANDBOX_SERVICE_TOKEN=${SAKURA_SANDBOX_SERVICE_TOKEN:?Production requires SAKURA_SANDBOX_SERVICE_TOKEN}
      - SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY=${SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY:?Production requires SAKURA_SANDBOX_CAPABILITY_SIGNING_KEY}
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from database.db import engine; from sqlalchemy import text; conn = engine.connect(); conn.execute(text('SELECT 1')); conn.close()\""]
      interval: 20s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
    container_name: sakura_frontend
    restart: always
    # Bind strictly to loopback so public traffic must pass through the TLS reverse proxy
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      backend-api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  sakura_workspaces:
    name: ${SAKURA_WORKSPACES_VOLUME_NAME:-sakura_workspaces}
  sakura_library_data:
    name: ${SAKURA_LIBRARY_VOLUME_NAME:-sakura_library_data}
